<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>立体大楼变变变</title>
  <meta name="description" content="在固定视角下随机生成由 6 个小正方体组成、两层高、底座范围为 2x3 的立体图形。">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f172a'/%3E%3Cpath d='M8 14 16 9l8 5-8 5-8-5Z' fill='%23d9fbff'/%3E%3Cpath d='M8 14v9l8 5v-9l-8-5Z' fill='%2379d7ee'/%3E%3Cpath d='M24 14v9l-8 5v-9l8-5Z' fill='%233aaac8'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #64748b;
      --line: #1f2937;
      --panel: #ffffff;
      --panel-soft: #f6f8fb;
      --cyan-front: #76d5eb;
      --cyan-side: #38aeca;
      --cyan-top: #d9fbff;
      --accent: #e85d3f;
      --accent-dark: #bf3f2d;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(135deg, rgba(217, 251, 255, 0.86), rgba(255, 255, 255, 0.66) 34%, rgba(255, 230, 219, 0.55)),
        #f7fafc;
      color: var(--ink);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(1080px, 100%);
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 22px;
      align-items: center;
    }

    .stage {
      min-height: 620px;
      background: var(--panel);
      border: 1px solid rgba(23, 32, 51, 0.12);
      border-radius: 8px;
      box-shadow: 0 24px 70px rgba(15, 23, 42, 0.12);
      display: grid;
      place-items: center;
      padding: 24px;
      overflow: hidden;
    }

    svg {
      width: min(760px, 100%);
      height: auto;
      display: block;
    }

    .cube-face {
      stroke: var(--line);
      stroke-width: 3.5;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .face-front {
      fill: var(--cyan-front);
    }

    .face-side {
      fill: var(--cyan-side);
    }

    .face-top {
      fill: var(--cyan-top);
    }

    .cube {
      transition: transform 160ms ease, opacity 160ms ease;
    }

    .shadow {
      fill: rgba(15, 23, 42, 0.08);
      filter: blur(3px);
    }

    .panel {
      width: 100%;
      background: var(--panel);
      border: 1px solid rgba(23, 32, 51, 0.12);
      border-radius: 8px;
      box-shadow: 0 18px 56px rgba(15, 23, 42, 0.1);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .panel > div:first-child {
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 1.45rem;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .hint {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.96rem;
      line-height: 1.65;
    }

    .controls {
      display: grid;
      gap: 10px;
      width: 100%;
      max-width: 220px;
      margin: 0 auto;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 8px;
      min-height: 48px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform 140ms ease, box-shadow 140ms ease, background 140ms ease;
    }

    button:focus-visible {
      outline: 3px solid rgba(232, 93, 63, 0.35);
      outline-offset: 3px;
    }

    #toggle {
      background: var(--accent);
      color: #ffffff;
      box-shadow: 0 12px 22px rgba(232, 93, 63, 0.28);
    }

    #toggle:hover {
      background: var(--accent-dark);
      transform: translateY(-1px);
    }

    #single {
      background: #182033;
      color: #ffffff;
    }

    #single:hover {
      background: #0f172a;
      transform: translateY(-1px);
    }

    @media (max-width: 820px) {
      body {
        padding: 16px;
      }

      main {
        grid-template-columns: 1fr;
      }

      .stage {
        min-height: 420px;
        padding: 12px;
      }

      .panel {
        gap: 14px;
      }
    }
  </style>
</head>
<body>
  <main aria-label="立体大楼变变变">
    <section class="stage" aria-label="固定视角立体图形">
      <svg id="solid" viewBox="0 0 760 560" role="img" aria-label="由 6 个小正方体组成的立体图形"></svg>
    </section>

    <aside class="panel">
      <div>
        <h1>立体大楼变变变</h1>
        <p class="hint">始终保持 6 个小正方体、两层高度、2x3 底座范围。点击开始后连续随机变化，停止时保留当前图形。</p>
      </div>

      <div class="controls">
        <button id="toggle" type="button">开始随机</button>
        <button id="single" type="button">随机一次</button>
      </div>

    </aside>
  </main>

  <script>
    const svg = document.getElementById("solid");
    const toggleButton = document.getElementById("toggle");
    const singleButton = document.getElementById("single");

    const SIZE = 100;
    const DEPTH_X = 38;
    const DEPTH_Y = 38;
    const ORIGIN_X = 132;
    const BASE_Y = 430;
    const COLS = 3;
    const ROWS = 2;
    const TOTAL_CUBES = 6;

    let currentHeights = [
      [1, 1, 0],
      [2, 0, 2]
    ];
    let timer = null;

    function face(points, className) {
      const polygon = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
      polygon.setAttribute("points", points.map((point) => point.join(",")).join(" "));
      polygon.setAttribute("class", `cube-face ${className}`);
      return polygon;
    }

    function cubeOrigin(x, y, z) {
      return {
        x: ORIGIN_X + x * SIZE + y * DEPTH_X,
        y: BASE_Y - z * SIZE - y * DEPTH_Y
      };
    }

    function drawCube(x, y, z) {
      const p = cubeOrigin(x, y, z);
      const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
      group.setAttribute("class", "cube");
      group.setAttribute("data-position", `${x},${y},${z}`);

      const front = [
        [p.x, p.y],
        [p.x + SIZE, p.y],
        [p.x + SIZE, p.y + SIZE],
        [p.x, p.y + SIZE]
      ];
      const side = [
        [p.x + SIZE, p.y],
        [p.x + SIZE + DEPTH_X, p.y - DEPTH_Y],
        [p.x + SIZE + DEPTH_X, p.y + SIZE - DEPTH_Y],
        [p.x + SIZE, p.y + SIZE]
      ];
      const top = [
        [p.x, p.y],
        [p.x + DEPTH_X, p.y - DEPTH_Y],
        [p.x + SIZE + DEPTH_X, p.y - DEPTH_Y],
        [p.x + SIZE, p.y]
      ];

      group.append(
        face(front, "face-front"),
        face(side, "face-side"),
        face(top, "face-top")
      );
      return group;
    }

    function cubesFromHeights(heights) {
      const cubes = [];
      heights.forEach((row, y) => {
        row.forEach((height, x) => {
          for (let z = 0; z < height; z += 1) {
            cubes.push({ x, y, z });
          }
        });
      });
      // Paint the back row first so the front row correctly hides the
      // overlapping lower portion of cubes behind it.
      return cubes.sort((a, b) => b.y - a.y || a.x - b.x || a.z - b.z);
    }

    function draw(heights) {
      svg.replaceChildren();
      const shadow = document.createElementNS("http://www.w3.org/2000/svg", "ellipse");
      shadow.setAttribute("class", "shadow");
      shadow.setAttribute("cx", "372");
      shadow.setAttribute("cy", "462");
      shadow.setAttribute("rx", "250");
      shadow.setAttribute("ry", "38");
      svg.append(shadow);

      const cubes = cubesFromHeights(heights);
      cubes.forEach(({ x, y, z }) => svg.append(drawCube(x, y, z)));
    }

    function randomHeights() {
      while (true) {
        const values = new Array(COLS * ROWS).fill(0);
        let remaining = TOTAL_CUBES;

        while (remaining > 0) {
          const index = Math.floor(Math.random() * values.length);
          if (values[index] < 2) {
            values[index] += 1;
            remaining -= 1;
          }
        }

        const hasTopLayer = values.some((height) => height === 2);
        const spansAllColumns = Array.from({ length: COLS }, (_, x) =>
          Array.from({ length: ROWS }, (_, y) => values[y * COLS + x] > 0).some(Boolean)
        ).every(Boolean);
        const spansAllRows = Array.from({ length: ROWS }, (_, y) =>
          values.slice(y * COLS, (y + 1) * COLS).some((height) => height > 0)
        ).every(Boolean);

        if (!hasTopLayer || !spansAllColumns || !spansAllRows || !isConnected(values)) {
          continue;
        }

        return [
          values.slice(0, COLS),
          values.slice(COLS, COLS * ROWS)
        ];
      }
    }

    function isConnected(values) {
      const occupied = values
        .map((height, index) => height > 0 ? index : -1)
        .filter((index) => index >= 0);
      const visited = new Set([occupied[0]]);
      const queue = [occupied[0]];

      while (queue.length > 0) {
        const index = queue.shift();
        const x = index % COLS;
        const y = Math.floor(index / COLS);
        const neighbors = [
          [x - 1, y],
          [x + 1, y],
          [x, y - 1],
          [x, y + 1]
        ];

        neighbors.forEach(([nextX, nextY]) => {
          if (nextX < 0 || nextX >= COLS || nextY < 0 || nextY >= ROWS) {
            return;
          }
          const nextIndex = nextY * COLS + nextX;
          if (values[nextIndex] > 0 && !visited.has(nextIndex)) {
            visited.add(nextIndex);
            queue.push(nextIndex);
          }
        });
      }

      return visited.size === occupied.length;
    }

    function changeShape() {
      let next = randomHeights();
      while (JSON.stringify(next) === JSON.stringify(currentHeights)) {
        next = randomHeights();
      }
      currentHeights = next;
      draw(currentHeights);
    }

    function start() {
      timer = window.setInterval(changeShape, 360);
      toggleButton.textContent = "停止";
      singleButton.disabled = true;
      singleButton.style.opacity = "0.55";
    }

    function stop() {
      window.clearInterval(timer);
      timer = null;
      toggleButton.textContent = "开始随机";
      singleButton.disabled = false;
      singleButton.style.opacity = "1";
    }

    toggleButton.addEventListener("click", () => {
      if (timer) {
        stop();
      } else {
        start();
      }
    });

    singleButton.addEventListener("click", changeShape);

    draw(currentHeights);
  </script>
</body>
</html>
